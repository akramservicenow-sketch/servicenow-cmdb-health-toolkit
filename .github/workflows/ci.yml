name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Smoke test the CLI against the synthetic sample
        run: |
          cmdb-health scan --cis sample_data/cis.json --relationships sample_data/relationships.json \
            --as-of 2026-10-01 --format console,json,csv,html --output-dir reports
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sample-report
          path: reports/
